name: Packages
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    uses: ./.github/workflows/package.yml
    with:
      package: kraken-cli
    secrets:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
  binary:
    uses: ./.github/workflows/package.yml
    with:
      package: kraken-cli-bin
    secrets:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
